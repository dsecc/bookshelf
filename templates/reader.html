<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover: sin esto iOS reserva las safe areas (notch / barra de
     estado) y el contenido nunca puede llegar al borde de la pantalla. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lector</title>
<link rel="stylesheet" href="/static/css/nav.css?v={{ static_ver }}">
<link rel="stylesheet" href="/static/css/reader.css?v={{ static_ver }}">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/static/icons/favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bookshelf">
<meta name="theme-color" content="#0d0d0d">
</head>
<body>

<!-- Visores. Desde v1.15 no hay barra arriba ni barras de controles por modo:
     todo vive en la pildora de abajo (#readerNav), en PC y en el celu. Los
     modos de lectura del PDF son solo Scroll y Doble. -->
<div id="pdfScrollViewer" class="viewer" style="display:none">
  <div class="pdf-canvas-wrap" id="pdfScrollWrap"></div>
</div>

<div id="pdfSpreadViewer" class="viewer" style="display:none">
  <div class="spread-flip-wrap" id="spreadWrap">
    <div id="bookPagesContainerSpread"></div>
  </div>
</div>

<div id="epubViewer" class="viewer epub-viewer" style="display:none">
  <button class="epub-arrow epub-arrow-left" id="epubPrev" aria-label="Pagina anterior"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg></button>
  <div id="epubArea"></div>
  <button class="epub-arrow epub-arrow-right" id="epubNext" aria-label="Pagina siguiente"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg></button>
</div>

<div id="textViewer" class="viewer" style="display:none">
  <div class="text-wrap" id="textWrap">
    <article class="text-body" id="textBody"></article>
  </div>
</div>

<!-- Unsupported -->
<div id="unsupportedViewer" class="viewer" style="display:none">
  <div class="unsupported-msg">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:#555"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    <p>Este formato no se puede leer en el navegador.</p>
    <button class="r-btn-primary" id="btnDownloadUnsupported">Descargar archivo</button>
  </div>
</div>

<!-- Pildora del lector. En el celu: volver, buscar, bookmark y ajustes (los
     grupos son display:contents y lo marcado .rn-desk no se ve). En la PC es
     una sola barra centrada con todo: volver y titulo a la izquierda, la
     pagina (o los ajustes de letra de un texto) en el medio, herramientas a
     la derecha. Info y ajustes, bookmarks y el buscador crecen desde aca. -->
<nav class="bottom-nav reader-nav" id="readerNav">
  <span class="bn-indicator" id="rnIndicator" style="opacity:0"></span>
  <div class="rn-group rn-left">
    <button class="bn-item" id="rnBack" aria-label="Volver" title="Volver a la biblioteca"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg></button>
    <span class="rn-title rn-desk" id="readerTitle">Cargando...</span>
  </div>
  <div class="rn-group rn-center rn-desk" id="rnCenter">
    <div class="rn-pager" id="rnPager" hidden>
      <button class="rn-btn" id="rnPrev" aria-label="Pagina anterior" title="Anterior"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg></button>
      <label class="rn-page" title="Escribi un numero y Enter para ir a esa pagina">
        <input id="rnPageInput" type="text" inputmode="numeric" autocomplete="off" aria-label="Pagina actual" value="1">
        <span class="rn-total" id="rnPageTotal">/ 1</span>
      </label>
      <button class="rn-btn" id="rnNext" aria-label="Pagina siguiente" title="Siguiente"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg></button>
      <div class="rn-zoom" id="rnZoom" hidden>
        <button class="rn-btn" id="rnZoomOut" aria-label="Alejar" title="Alejar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14"/></svg></button>
        <button class="rn-zoom-label" id="rnZoomLabel" title="Volver al ajuste automatico">Auto</button>
        <button class="rn-btn" id="rnZoomIn" aria-label="Acercar" title="Acercar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
    <!-- Letra, tamaño y tema de los textos (TXT, MD, EPUB). En el celu se muda
         a la topbar flotante (#readerTopNav). Botones y no selects: un select
         con fuente chica hace zoom en iOS. -->
    <div class="text-ctl" id="textCtl" hidden>
      <button class="tc-btn tc-font" id="textFont" title="Tipo de letra">Serif</button>
      <span class="tc-group">
        <button class="tc-btn" id="textSmaller" aria-label="Letra mas chica" title="Letra mas chica"><span class="tc-a tc-a-sm">A</span></button>
        <span class="tc-size" id="textSize">18</span>
        <button class="tc-btn" id="textBigger" aria-label="Letra mas grande" title="Letra mas grande"><span class="tc-a tc-a-lg">A</span></button>
      </span>
      <span class="tc-group tc-themes">
        <button class="text-theme" data-theme="dark" title="Oscuro" aria-label="Tema oscuro"></button>
        <button class="text-theme" data-theme="sepia" title="Sepia" aria-label="Tema sepia"></button>
        <button class="text-theme" data-theme="light" title="Claro" aria-label="Tema claro"></button>
      </span>
    </div>
  </div>
  <div class="rn-group rn-right">
    <button class="bn-item" id="rnSearch" aria-label="Buscar" title="Buscar en el libro"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
    <button class="bn-item" id="rnBookmark" aria-label="Bookmarks" title="Bookmarks"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg></button>
    <button class="bn-item rn-desk" id="rnLupa" aria-label="Lupa" title="Lupa" hidden><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M11 8v6M8 11h6"/></svg></button>
    <button class="bn-item rn-desk" id="rnFullscreen" aria-label="Pantalla completa" title="Pantalla completa (F)"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
    <button class="bn-item" id="rnMore" aria-label="Info y ajustes" title="Info y ajustes"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
</nav>

<!-- Topbar flotante (celu): gemela de la pildora, anclada arriba. Solo aparece
     cuando hace falta (hoy: los ajustes de letra de un texto). -->
<div class="top-nav" id="readerTopNav" hidden></div>

<!-- Buscador: sale de atras de la pildora (ver .nav-search en nav.css). -->
<div class="nav-search search-bar-reader" id="searchBarReader">
  <input type="text" id="searchTextInput" placeholder="Buscar en el libro..." enterkeyhint="search" autocomplete="off">
  <span id="searchResults" class="search-results-count"></span>
  <button class="r-btn" id="btnSearchPrev" aria-label="Coincidencia anterior" title="Anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m18 15-6-6-6 6"/></svg></button>
  <button class="r-btn" id="btnSearchNext" aria-label="Coincidencia siguiente" title="Siguiente"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 9 6 6 6-6"/></svg></button>
  <button class="r-btn" id="btnSearchClose" aria-label="Cerrar busqueda" title="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
</div>

<!-- Barra de nuevo bookmark: la misma pieza que el buscador. -->
<div class="nav-search bm-bar" id="bmBarReader">
  <input type="text" id="bmBarInput" placeholder="Nombre del bookmark" enterkeyhint="done" autocomplete="off">
  <button class="r-btn bm-bar-save" id="bmBarSave" aria-label="Guardar bookmark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="20 6 9 17 4 12"/></svg></button>
</div>

<div id="magnifierLens"><canvas id="magnifierCanvas"></canvas><span class="lens-hint" id="lensHint"></span></div>
<div id="magnifierCursor"></div>

<div id="toast" class="toast"></div>
<!-- Librerias servidas localmente: el lector tiene que funcionar sin internet
     (modo offline) y en un servidor privado sin salida a la red. -->
<script src="/static/js/vendor/pdf.min.js?v={{ static_ver }}"></script>
<script src="/static/js/vendor/jszip.min.js?v={{ static_ver }}"></script>
<script src="/static/js/vendor/page-flip.browser.js?v={{ static_ver }}"></script>
<script src="/static/js/vendor/epub.min.js?v={{ static_ver }}"></script>
<script src="/static/js/nav.js?v={{ static_ver }}"></script>
<script src="/static/js/progress.js?v={{ static_ver }}"></script>
<script src="/static/js/mdlite.js?v={{ static_ver }}"></script>
<script src="/static/js/reader.js?v={{ static_ver }}"></script>
</body>
</html>
