<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover: sin esto iOS reserva las safe areas (notch / barra de
     estado) y el contenido nunca puede llegar al borde de la pantalla. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Lector</title>
<link rel="stylesheet" href="/static/css/reader.css?v={{ static_ver }}">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/static/icons/favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bookshelf">
<meta name="theme-color" content="#0d0d0d">
</head>
<body>

<div class="reader-topbar" id="readerTopbar">
  <div class="reader-topbar-inner">
    <a href="/" class="r-btn" title="Volver" id="btnBack">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <span class="reader-title" id="readerTitle">Cargando...</span>
    <div class="reader-actions">
      <button class="r-btn" id="btnSearch" title="Buscar en el libro">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <button class="r-btn" id="btnHighlight" title="Subrayar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </button>
      <button class="r-btn" id="btnBookmark" title="Bookmark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
      </button>
      <button class="r-btn" id="btnBookmarkList" title="Ver bookmarks">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </button>
      <button class="r-btn" id="btnMagnifier" title="Lupa (solo modo Doble)" style="display:none">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M11 8v6M8 11h6"/></svg>
      </button>
      <button class="r-btn" id="btnFullscreen" title="Pantalla completa">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <button class="r-btn" id="btnDownloadReader" title="Descargar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="r-btn" id="btnShareReader" title="Compartir">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
      <button class="r-btn" id="btnInfo" title="Info y ajustes">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </button>
    </div>
  </div>
  <!-- Barra de busqueda en libro -->
  <div class="search-bar-reader" id="searchBarReader" style="display:none">
    <input type="text" id="searchTextInput" placeholder="Buscar en el libro...">
    <span id="searchResults" class="search-results-count"></span>
    <button class="r-btn" id="btnSearchPrev">&#8593;</button>
    <button class="r-btn" id="btnSearchNext">&#8595;</button>
    <button class="r-btn" id="btnSearchClose">&#10005;</button>
  </div>
</div>

<!-- Highlight toolbar flotante -->
<div class="highlight-toolbar" id="highlightToolbar" style="display:none">
  <button class="hl-color" data-color="#fbbf24" style="background:#fbbf24" title="Amarillo"></button>
  <button class="hl-color" data-color="#34d399" style="background:#34d399" title="Verde"></button>
  <button class="hl-color" data-color="#60a5fa" style="background:#60a5fa" title="Azul"></button>
  <button class="hl-color" data-color="#f87171" style="background:#f87171" title="Rojo"></button>
  <button class="r-btn hl-apply" id="btnApplyHighlight" title="Subrayar">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
  </button>
</div>

<!-- PDF SCROLL MODE -->
<div id="pdfScrollViewer" class="viewer" style="display:none">
  <div class="pdf-controls" id="pdfControls">
    <button class="r-btn ctrl-btn" id="pdfScrollPrev">&#8249;</button>
    <span id="pdfScrollInfo">1 / 1</span>
    <button class="r-btn ctrl-btn" id="pdfScrollNext">&#8250;</button>
    <input type="number" id="pdfScrollPageInput" min="1" value="1">
    <button class="r-btn ctrl-btn" id="pdfScrollGo">Ir</button>
    <select id="pdfScrollZoom" class="ctrl-select">
      <option value="auto">Auto</option>
      <option value="0.6">60%</option>
      <option value="0.75">75%</option>
      <option value="1">100%</option>
      <option value="1.25">125%</option>
      <option value="1.5">150%</option>
      <option value="2">200%</option>
    </select>
  </div>
  <div class="pdf-canvas-wrap" id="pdfScrollWrap">
    <canvas id="pdfScrollCanvas"></canvas>
  </div>
</div>

<!-- PDF PAGE MODE -->
<div id="pdfPageViewer" class="viewer" style="display:none">
  <div class="pdf-page-wrap" id="pdfPageWrap">
    <canvas id="pdfPageCanvas"></canvas>
    <!-- Flechas laterales flotantes -->
    <button class="page-arrow-btn page-arrow-left" id="pdfPageArrowPrev">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button class="page-arrow-btn page-arrow-right" id="pdfPageArrowNext">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>
  <!-- Footer auto-oculto -->
  <div class="page-footer-controls" id="pdfPageFooter">
    <button class="r-btn ctrl-btn" id="pdfPagePrev">&#8249; Anterior</button>
    <span id="pdfPageInfo">1 / 1</span>
    <button class="r-btn ctrl-btn" id="pdfPageNext">Siguiente &#8250;</button>
    <input type="number" id="pdfPageInput" min="1" value="1" style="width:50px">
    <button class="r-btn ctrl-btn" id="pdfPageGo">Ir</button>
    <select id="pdfPageZoom" class="ctrl-select">
      <option value="auto">Auto</option>
      <option value="0.75">75%</option>
      <option value="1">100%</option>
      <option value="1.25">125%</option>
      <option value="1.5">150%</option>
    </select>
  </div>
</div>

<!-- PDF BOOK MODE (StPageFlip) -->
<div id="pdfBookViewer" class="viewer" style="display:none">
  <div class="book-flip-wrap" id="bookFlipWrap">
    <div id="bookPagesContainer"></div>
  </div>
  <div class="book-controls">
    <button class="r-btn ctrl-btn" id="bookPrev">&#8249; Anterior</button>
    <span id="bookPageInfo">1 / 1</span>
    <button class="r-btn ctrl-btn" id="bookNext">Siguiente &#8250;</button>
  </div>
</div>

<!-- PDF SPREAD MODE (StPageFlip doble pagina) -->
<div id="pdfSpreadViewer" class="viewer" style="display:none">
  <div class="spread-flip-wrap" id="spreadWrap">
    <div id="bookPagesContainerSpread"></div>
  </div>
  <div class="page-footer-controls" id="pdfSpreadFooter">
    <button class="r-btn ctrl-btn" id="spreadPrev">&#8249; Anterior</button>
    <span id="spreadPageInfo">1 / 1</span>
    <button class="r-btn ctrl-btn" id="spreadNext">Siguiente &#8250;</button>
    <input type="number" id="spreadPageInput" min="1" value="1" style="width:50px">
    <button class="r-btn ctrl-btn" id="spreadGo">Ir</button>
  </div>
</div>

<!-- EPUB -->
<div id="epubViewer" class="viewer epub-viewer" style="display:none">
  <button class="epub-arrow epub-arrow-left" id="epubPrev">&#8249;</button>
  <div id="epubArea"></div>
  <button class="epub-arrow epub-arrow-right" id="epubNext">&#8250;</button>
  <div class="epub-controls">
    <label>Fuente:<select id="epubFont"><option value="serif">Serif</option><option value="sans-serif">Sans</option><option value="monospace">Mono</option></select></label>
    <label>Tamano:<input type="range" id="epubFontSize" min="12" max="28" value="18"></label>
    <label>Tema:<select id="epubTheme"><option value="light">Claro</option><option value="dark">Oscuro</option><option value="sepia">Sepia</option></select></label>
  </div>
</div>

<!-- Unsupported -->
<div id="unsupportedViewer" class="viewer" style="display:none">
  <div class="unsupported-msg">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:#555"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    <p>Este formato no se puede leer en el navegador.</p>
    <button class="r-btn-primary" id="btnDownloadUnsupported">Descargar archivo</button>
  </div>
</div>

<!-- Panel Bookmarks -->
<div class="side-panel" id="bookmarksPanel">
  <div class="panel-header"><span>Bookmarks</span><button class="r-btn" id="closeBmPanel"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <ul id="bmList" class="panel-list"></ul>
</div>

<!-- Panel Info -->
<div class="side-panel" id="infoPanel">
  <div class="panel-header"><span>Libro</span><button class="r-btn" id="closeInfoPanel"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="panel-body">
    <p class="panel-label">Titulo</p>
    <div class="panel-rename">
      <input type="text" id="infoTitleInput" class="panel-input" placeholder="Nombre del libro">
      <button class="r-btn-accent" id="btnRenameBook"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></button>
    </div>
    <p class="panel-label" style="margin-top:1rem">Modo de visualizacion</p>
    <div class="view-mode-selector" id="viewModeSelector">
      <button class="vm-btn" data-mode="scroll" title="Scroll continuo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        Scroll
      </button>
      <button class="vm-btn" data-mode="page" title="Pagina por pagina">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        Pagina
      </button>
      <button class="vm-btn" data-mode="book" title="Libro (voltear hoja)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Libro
      </button>
      <button class="vm-btn" data-mode="spread" title="Dos paginas lado a lado">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="9" height="18" rx="1"/><rect x="13" y="3" width="9" height="18" rx="1"/></svg>
        Doble
      </button>
    </div>
    <p class="panel-label" style="margin-top:1rem">Coleccion</p>
    <select id="infoCollection" class="panel-select"></select>
    <button class="r-btn-primary" id="btnMoveCollection" style="margin-top:.5rem;width:100%">Guardar coleccion</button>
    <hr class="panel-divider">
    <button class="btn-share-wa" id="btnWhatsappPanel">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
      Compartir por WhatsApp
    </button>
    <button class="btn-share-wa" id="btnSendToUser" style="margin-top:.5rem">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
      Enviar a otro usuario
    </button>
    <button class="btn-share-wa" id="btnOffline" style="margin-top:.5rem">
      <span id="btnOfflineIcon"></span>
      <span id="btnOfflineLabel">Guardar sin conexion</span>
    </button>
    <hr class="panel-divider">
    <button class="btn-danger-reader" id="btnDeleteReader">Eliminar libro</button>
  </div>
</div>

<!-- Modal bookmark -->
<div class="modal-overlay" id="modalBookmark" style="display:none">
  <div class="modal-sm">
    <div class="modal-header"><h2>Nuevo bookmark</h2><button class="r-btn modal-close" data-modal="modalBookmark"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="form-group"><label>Nombre (opcional)</label><input type="text" id="bmNameInput" placeholder="Ej: Capitulo 5"></div>
    <button class="r-btn-primary full" id="btnSaveBookmark">Guardar</button>
  </div>
</div>

<!-- Modal enviar a otro usuario -->
<div class="modal-overlay" id="modalSendUser" style="display:none">
  <div class="modal-sm">
    <div class="modal-header">
      <h2>Enviar a otro usuario</h2>
      <button class="r-btn modal-close" data-modal="modalSendUser">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="form-group">
      <label>Destinatario</label>
      <select id="sendUserSelect" class="panel-select"></select>
    </div>
    <button class="r-btn-primary full" id="btnConfirmSendUser">Enviar</button>
  </div>
</div>

<!-- Modal confirmar eliminar -->
<div class="modal-overlay" id="modalDelete" style="display:none">
  <div class="modal-sm">
    <div class="modal-header"><h2>Eliminar libro</h2></div>
    <p style="font-size:.88rem;color:var(--text-dim);margin-bottom:1.25rem">Esta accion no se puede deshacer.</p>
    <div style="display:flex;gap:.5rem">
      <button class="r-btn-secondary full" id="btnCancelDelete">Cancelar</button>
      <button class="btn-danger-reader full" id="btnConfirmDelete">Eliminar</button>
    </div>
  </div>
</div>

<div id="magnifierLens"><canvas id="magnifierCanvas"></canvas></div>
<div id="magnifierCursor"></div>
<div id="toast" class="toast"></div>
<!-- Librerias servidas localmente: el lector tiene que funcionar sin internet
     (modo offline) y en un servidor privado sin salida a la red. -->
<script src="/static/js/vendor/pdf.min.js?v={{ static_ver }}"></script>
<script src="/static/js/vendor/jszip.min.js?v={{ static_ver }}"></script>
<script src="/static/js/vendor/page-flip.browser.js?v={{ static_ver }}"></script>
<script src="/static/js/vendor/epub.min.js?v={{ static_ver }}"></script>
<script src="/static/js/reader.js?v={{ static_ver }}"></script>
</body>
</html>
